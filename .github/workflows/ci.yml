name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: ["24.15", "26"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: wrong-room
        run: npm run test:wrong-room

      - name: pack
        run: npm pack --dry-run

      - name: repo-scan
        run: node --test "dist/test/security/repo-scan.test.js"
