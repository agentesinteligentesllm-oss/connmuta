schema: spec-driven

context: |
  Conmuta (working name, B-11 pending trademark clearance): a project-scoped
  Telegram agent bus. Status F1 apply in progress -- PR-01a, PR-01b, PR-02, PR-03,
  PR-04 and PR-05 merged (scaffold, CI, static gates, shared/constants.ts, provenance
  mechanism, shared/envelope.ts AS-IS, shared/secrets.ts SEAM, shared/thread-record.ts
  SEAM, shared/protocol-apply.ts SEAM D-05); next slice PR-06.
  Ratified stack for F1 onward (ADR-0028..0031): Node.js >= 24 LTS,
  TypeScript -> ESM, node:test, @modelcontextprotocol/sdk + zod, node:sqlite
  ledger, @clack/prompts, @napi-rs/keyring. Wire: emit AGENTBUS/2, accept
  /1 and /2, no wire change (CONSTITUTION.md rule W1). First SDD change:
  f1-daemon-registry-thin-client (WORK-PLAN.md).

strict_tdd: true

testing:
  status: active
  test_runner: node:test
  projects:
    - path: "."
      stack: "Node.js >= 24, TypeScript -> ESM (tsc -b project references)"
      test_command: "npm test"
      build_command: "npm run build"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage: false
  quality_tools:
    linter: false
    type_checker: true
    formatter: false
  test_command: "npm test"
  build_command: "npm run build"
  note: >
    Detection now succeeds after PR-01a: package.json, tsconfig project
    references and CI exist, and `npm test` (tsc -b && node --test
    "dist/test/**/*.test.js") is the single workspace-level command covering
    the one in-scope project. The binding policy statement in
    rules.apply.strict_tdd_policy remains in force unchanged.

session:
  execution_mode: auto
  artifact_store: hybrid
  delivery_strategy: auto-chain
  review_budget_lines: 400
  planned_first_change: f1-daemon-registry-thin-client

rules:
  proposal:
    - State the wire policy explicitly: emit AGENTBUS/2, accept /1 and /2, no wire change (CONSTITUTION.md section 4, rule W1)
    - State explicitly whether the change touches any of the five invariants in CONSTITUTION.md section 2, and name which
  specs:
    - Use Given/When/Then for every scenario
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Cite the ADR the design implements, or amend it via a new ADR (CONSTITUTION.md section 9, GOVERNANCE.md section 4)
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Every numeric constant is a named constant with its reasoning next to it (named-constant rule, CONSTITUTION.md section 5)
    - Include the 400-line Review Workload Forecast (review_budget_lines: 400); recommend chained PRs when at risk
  apply:
    guidelines:
      - Follow the conventions F1 establishes in src/ and test/ once they exist
    tdd: true
    strict_tdd_policy: >
      Strict TDD is binding project policy (CONSTITUTION.md section 6,
      GOVERNANCE.md section 6): red before green, every src file has a test
      counterpart under test/ with the same base name. Detection confirmed it
      on 2026-09-16 after PR-01a (`strict_tdd: true` above); the policy is
      binding regardless of the detection state.
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
